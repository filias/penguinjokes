[project]
name = "penguinjokes"
version = "0.1.0"
description = "AI-powered dad jokes with a penguin theme"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "jinja2>=3.1",
    "openai>=1.25",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "sqlmodel>=0.0.18",
    "gunicorn>=22",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["app.py", "logic.py", "models.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
